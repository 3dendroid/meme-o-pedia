<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meme-o-pedia</title>
<style>
  :root { --bg:#fff; --fg:#111; --muted:#555; --line:#111; --soft:#f2f2f2; --accent:#ffd60a; --blue:#2f5bea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f2f2f2; --muted:#b0b0b0; --line:#f2f2f2; --soft:#222; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px; display:flex; flex-direction:column; gap:16px; }
  h1 { margin:0; font-size:32px; letter-spacing:-.5px; }
  h1 span { background:var(--accent); color:#111; padding:0 6px; }
  input, button { font:inherit; color:inherit; }
  input[type=search] { width:100%; height:46px; padding:0 14px; border:0; border-radius:12px; background:var(--soft); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .chip { flex-shrink:0; height:38px; padding:0 14px; border:2px solid var(--line); border-radius:999px; background:var(--bg); cursor:pointer; font-weight:600; font-size:14px; }
  .chip[aria-pressed=true] { background:var(--fg); color:var(--bg); }
  .bar { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:14px; }
  .bar button { border:0; background:none; font-weight:600; cursor:pointer; min-height:36px; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px; }
  li { border:2px solid var(--line); border-radius:16px; padding:14px; display:flex; flex-direction:column; gap:6px; }
  .title { font-weight:700; font-size:18px; }
  .meta { color:var(--muted); font-size:14px; }
  .badge { align-self:flex-start; font-size:12px; font-weight:600; padding:2px 8px; border-radius:999px; }
  .trend { background:var(--accent); color:#111; }
  .classic { background:var(--blue); color:#fff; }
  .outdated { background:var(--soft); color:var(--muted); }
  .error { color:#c62828; }
</style>
</head>
<body>
<main>
  <h1>Meme-o-<span>pedia</span></h1>
  <label for="q" hidden>Search</label>
  <input id="q" type="search" placeholder="Search memes">
  <div class="chips" id="countries"></div>
  <div class="bar"><span id="count"></span><button id="sort" type="button">Newest first</button></div>
  <ul id="list"></ul>
</main>
<script>
const STATUS = { trend: 'Trending', classic: 'Classic', outdated: 'Outdated' };
const state = { country: '', q: '', sort: 'new' };
const $ = (id) => document.getElementById(id);

function el(tag, props, text) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  if (text !== undefined) e.textContent = text;
  return e;
}

async function loadCountries() {
  const res = await fetch('/api/countries');
  const countries = await res.json();
  const box = $('countries');
  const all = [{ code: '', name: 'All' }, ...countries];
  for (const c of all) {
    const b = el('button', { type: 'button', className: 'chip' }, c.count ? `${c.name} · ${c.count}` : c.name);
    b.setAttribute('aria-pressed', String(c.code === state.country));
    b.onclick = () => {
      state.country = c.code;
      box.querySelectorAll('.chip').forEach((x) => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      loadMemes();
    };
    box.append(b);
  }
}

async function loadMemes() {
  const params = new URLSearchParams(state);
  const list = $('list');
  try {
    const res = await fetch('/api/memes?' + params);
    if (!res.ok) throw new Error((await res.json()).error);
    const memes = await res.json();
    $('count').textContent = memes.length + (memes.length === 1 ? ' meme' : ' memes');
    list.replaceChildren(...memes.map((m) => {
      const li = el('li');
      li.append(
        el('span', { className: 'title' }, m.title),
        el('span', { className: 'meta' }, `${m.country_name} · ${m.year}`),
        el('span', { className: 'badge ' + m.status }, STATUS[m.status] || m.status),
        el('span', {}, m.description),
      );
      return li;
    }));
  } catch (e) {
    list.replaceChildren(el('li', { className: 'error' }, 'Could not load memes: ' + e.message));
  }
}

let timer;
$('q').oninput = (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value; loadMemes(); }, 300);
};
$('sort').onclick = (e) => {
  state.sort = state.sort === 'new' ? 'old' : 'new';
  e.target.textContent = state.sort === 'new' ? 'Newest first' : 'Oldest first';
  loadMemes();
};

loadCountries();
loadMemes();
</script>
</body>
</html>
