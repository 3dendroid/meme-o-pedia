# SeaweedFS: S3-compatible storage for meme pictures.
# A StatefulSet with its own disk, like Postgres: pictures survive pod restarts.
# The access keys live in the seaweedfs-s3 Secret, mounted into the pod as a file
# (created from .env by scripts/kind-up.sh).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          # One process runs everything: master, volume server, filer and the S3 gateway.
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB=64
            - -volume.max=20
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        # Each key of the Secret becomes a file: /etc/seaweedfs/s3.json
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
