# Если средняя загрузка CPU подов API выше 60% от requests.cpu,
# HPA добавляет поды (до 8), а когда нагрузка спадает — убирает.
# Работает только при установленном metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
