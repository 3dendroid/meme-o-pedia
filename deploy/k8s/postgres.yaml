# StatefulSet, а не Deployment: у базы постоянное имя (postgres-0)
# и свой диск (PersistentVolumeClaim), который переживает перезапуск пода.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: DNS-имя postgres указывает прямо на под
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: memes
            - name: POSTGRES_DB
              value: memes
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "memes"]
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
