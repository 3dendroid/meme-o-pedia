# Gateway API: the entry point into the cluster.
# Traffic: browser -> port 8080 of the host -> kind port mapping -> NodePort 30080
#   -> Envoy (the Gateway) -> HTTPRoute -> the api Service.
# Envoy Gateway (the controller that turns these objects into a running Envoy)
# is installed by scripts/kind-up.sh.

# How the Envoy for our Gateway is exposed: a NodePort Service on the fixed port 30080,
# which deploy/kind-config.yaml maps to port 8080 of the host.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          value:
            spec:
              ports:
                - port: 80 # the listener port below
                  nodePort: 30080
---
# The Gateway: one HTTP listener on port 80, run by Envoy Gateway
# with the settings from the EnvoyProxy above.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: memes
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: nodeport
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
# The route: all requests that reach the Gateway go to the api Service.
# Add "hostnames: [memes.local]" to accept only requests for that name.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memes
spec:
  parentRefs:
    - name: memes
  rules:
    - backendRefs:
        - name: api
          port: 80
