apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort # port 30080 on every node; kind maps it to localhost:8080
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2 # after that the HPA controls the count (hpa.yaml)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: meme-o-pedia:dev # loaded into kind with kind load docker-image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_ADDR
              value: redis:6379
            - name: S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: S3_BUCKET
              value: memes
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: s3-secret-key
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: db-password
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: admin-token
          # Is the process alive? If not, Kubernetes restarts the container.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          # Is it ready for requests? Until it is, no traffic goes to the pod.
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          # The HPA needs requests: it measures load as a percentage of requests.cpu.
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
