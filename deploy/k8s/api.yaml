apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort # порт 30080 на каждом узле; kind пробрасывает его на localhost:8080
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2 # дальше количеством управляет HPA (hpa.yaml)
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: meme-o-pedia:dev # загружается в kind командой kind load docker-image
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgres
            - name: REDIS_ADDR
              value: redis:6379
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: db-password
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: meme-secrets
                  key: admin-token
          # Жив ли процесс? Если нет — Kubernetes перезапустит контейнер.
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          # Готов ли принимать запросы? Пока нет — трафик на под не идёт.
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 5
          # requests нужны HPA: он считает загрузку в процентах от requests.cpu.
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
