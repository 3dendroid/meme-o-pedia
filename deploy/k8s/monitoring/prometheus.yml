# Prometheus collects metrics every 5 seconds from every API pod.
# It finds the pods through the Kubernetes API (kubernetes_sd_configs),
# so pods added by the HPA are picked up automatically.
global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [memes]
    relabel_configs:
      # Keep only API pods...
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: api
        action: keep
      # ...and only their metrics port (the pod also declares the public port 8080).
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      # Show the pod name in Prometheus and Grafana.
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
