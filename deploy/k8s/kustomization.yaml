# Apply with: kubectl apply -k deploy/k8s
# The meme-secrets Secret is not included: it is created separately from .env
# (see scripts/kind-up.sh) so that passwords never end up in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memes
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - api.yaml
  - hpa.yaml
