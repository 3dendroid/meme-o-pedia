# Apply with: kubectl apply -k deploy/k8s
# The meme-secrets Secret is not included: it is created separately from .env
# (see scripts/kind-up.sh) so that passwords never end up in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: memes
resources:
  - namespace.yaml
  - postgres.yaml
  - redis.yaml
  - seaweedfs.yaml
  - api.yaml
  - hpa.yaml
  - cronjob.yaml
  - gateway.yaml
  - monitoring.yaml

# Config files become ConfigMaps. The generated name gets a hash of the contents,
# so changing a file makes Kubernetes restart the pods that use it.
configMapGenerator:
  - name: prometheus-config
    files: [monitoring/prometheus.yml]
  - name: grafana-datasources
    files: [monitoring/datasources.yaml]
  - name: grafana-dashboard-providers
    files: [monitoring/dashboard-providers.yaml]
  - name: grafana-dashboards
    files: [monitoring/memes-dashboard.json]
